<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Последний обход</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#ddd7c8;--mut:#8b8678;--red:#c0392f;--teal:#6fb3a8;--amb:#d9a441;--line:#25302f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050707;color:var(--ink);font:9px/1.9 'Press Start 2P',monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;width:min(100vw,calc(100dvh*480/216));aspect-ratio:480/216;display:block;touch-action:none}
#ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,7,7,.93);padding:12px;overflow-y:auto;text-align:center;touch-action:pan-y}
.in{max-width:560px;width:100%;margin:auto}
h1{font-size:18px;line-height:1.5;margin-bottom:8px;text-shadow:0 0 18px rgba(192,57,47,.6)}h2{color:var(--amb);font-size:12px;margin-bottom:10px}
p{margin-bottom:10px}.q{color:var(--mut)}.lg{color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .b{flex:1;min-width:140px}
.b{display:block;width:100%;margin-top:8px;padding:10px;font:9px/1.7 'Press Start 2P',monospace;color:var(--ink);background:#101716;border:2px solid var(--line);cursor:pointer;text-align:left}
.b:active,.b:hover{border-color:var(--amb)}.b b{color:var(--amb);font-weight:400}.b span{color:var(--mut);font-size:8px}
#scr{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000;pointer-events:none}#scr.on{display:flex;animation:fl .9s steps(2)}#scr svg{height:90dvh;animation:zm .9s ease-in}
@keyframes zm{from{transform:scale(.4)}to{transform:scale(1.5)}}@keyframes fl{0%,40%,80%{background:#fff}20%,60%,100%{background:#000}}
#mu{position:fixed;top:6px;right:8px;z-index:40;width:30px;height:30px;border:2px solid var(--line);background:#0c1110;color:var(--ink);font-size:12px}
#rot{position:fixed;inset:0;z-index:99;background:#050707;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:12px;line-height:2}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
.b:focus{outline:none}.b:focus-visible{border-color:var(--amb);background:#16201f}
#tc{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}#tc.on{display:block}
#tc .g{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end}
#tc .l{left:max(14px,env(safe-area-inset-left))}#tc .r{right:max(14px,env(safe-area-inset-right))}
#tc button{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:rgba(16,23,22,.55);color:var(--ink);font:24px/1 sans-serif;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0}
#tc button.big{width:76px;height:76px;border-color:var(--red)}#tc button.on{border-color:var(--amb);background:rgba(217,164,65,.35)}
</style></head><body>
<canvas id="c" width="480" height="216"></canvas>
<div id="ov"></div><div id="scr"></div><button id="mu">♪</button><div id="tc"><div class="g l"><button data-k="L">◀</button><button data-k="R">▶</button></div><div class="g r"><button data-k="D">⚡</button><button data-k="J">▲</button><button data-k="A" class="big">⚔</button></div></div><div id="rot">Поверни телефон горизонтально ↻</div>
